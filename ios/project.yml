# XcodeGen turns this file into iOSApp.xcodeproj on the Mac (xcodegen generate). Edit this, not the .xcodeproj.
# Target and scheme names stay "iOSApp" so the GitHub workflows (stormbreaker-ios.yml, stormbreaker-testflight.yml)
# keep working; the product shown on the phone is DiabetEasy.
name: iOSApp
options:
  bundleIdPrefix: com.diabeteasy
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  iOSApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
          - "Resources/DiabetEasy.entitlements"
      - path: Sources/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: Sources/Resources/DiabetEasy.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diabeteasy.app
        INFOPLIST_KEY_CFBundleDisplayName: DiabetEasy
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSHealthShareUsageDescription: "DiabetEasy reads your blood glucose readings from Apple Health to show them in your charts and insights. It never writes to Apple Health."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo of your meal or journal entry to attach it to your log."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Choose a photo of your meal or journal entry to attach it to your log."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  iOSAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diabeteasy.app.tests
    dependencies:
      - target: iOSApp
  iOSAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.diabeteasy.app.uitests
    dependencies:
      - target: iOSApp
schemes:
  iOSApp:
    build:
      targets:
        iOSApp: all
    test:
      targets: [iOSAppTests, iOSAppUITests]
