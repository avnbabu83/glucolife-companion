# Sends the iOS app to TestFlight. Run it from Stormbreaker (Send to TestFlight) or the Actions tab. Needs, under
# the repository's Settings > Secrets and variables > Actions: ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App
# Store Connect API key with App Manager access; paste the whole .p8 file) and APPLE_TEAM_ID. Apple signs the app
# automatically with that key; no certificates to manage. The bundle ID in ios/project.yml must match an app
# created in App Store Connect.
name: TestFlight
on:
  workflow_dispatch:
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the App Store Connect settings
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (APPLE_TEAM_ID for TEAM_ID)"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archive (signed by Apple with the API key)
        run: |
          xcodebuild archive -project iOSApp.xcodeproj -scheme iOSApp -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iOSApp.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee xcodebuild.log
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iOSApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tee -a xcodebuild.log
          echo "Uploaded build ${{ github.run_number }}. Apple processes it (usually 10-30 minutes) before it shows in TestFlight."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
