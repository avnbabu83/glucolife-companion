# Stormbreaker TestFlight (template v4). Sends the iOS app to TestFlight. Stormbreaker's Send to TestFlight tags the
# pushed branch (testflight-...), which runs this from that branch, so nothing needs merging; it also runs from the
# Actions tab. Needs, under the repository's Settings > Secrets and variables > Actions: ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8 (an App Store Connect API key with Admin access, which signing on GitHub's Mac needs; paste the whole
# .p8 file) and APPLE_TEAM_ID. Apple signs the app automatically with that key; no certificates to manage. The
# bundle ID in ios/project.yml must match an app created in App Store Connect. An app without an icon gets a simple
# one for this upload (App Store Connect refuses builds without one); add your own to replace it.
name: TestFlight
on:
  push:
    tags: ["testflight-*"]
  workflow_dispatch:
concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false
env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        # bash here means -eo pipefail: a failing xcodebuild fails its step even though the output goes through tee.
        shell: bash
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the App Store Connect settings
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID ASC_KEY_P8; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing (APPLE_TEAM_ID for TEAM_ID)"; exit 1; fi
          case "$ASC_KEY_P8" in *"BEGIN PRIVATE KEY"*) ;; *) echo "::error::ASC_KEY_P8 is not a .p8 key: paste the whole file, including the BEGIN and END lines"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
      - name: Give the app an icon if it has none
        run: |
          ruby - <<'RUBY'
          require "yaml"; require "json"; require "fileutils"
          own = (Dir.glob("**/*.appiconset") + Dir.glob("**/*.icon")).reject { |d| d.start_with?("build/") }
          sets = own.select { |d| d.end_with?(".appiconset") }
          if own.any? { |d| d.end_with?(".icon") } || sets.any? { |d| Dir.glob("#{d}/*.png").any? }
            puts "The app has its own icon."
            exit 0
          end
          spec = YAML.respond_to?(:unsafe_load_file) ? YAML.unsafe_load_file("project.yml") : YAML.load_file("project.yml")
          _, app = (spec["targets"] || {}).find { |_, t| t["type"] == "application" }
          abort("::error::ios/project.yml has no application target") unless app
          settings = app["settings"] || {}
          title = ((settings["base"] || settings)["INFOPLIST_KEY_CFBundleDisplayName"] || spec["name"] || "App").to_s
          if sets.any?
            dir = sets.first  # an empty icon set: fill it
          else
            dir = "StormbreakerIcon/Assets.xcassets/AppIcon.appiconset"
            FileUtils.mkdir_p(dir)
            File.write("StormbreakerIcon/Assets.xcassets/Contents.json", JSON.generate({info: {author: "xcode", version: 1}}))
            sources = app["sources"].is_a?(Array) ? app["sources"] : [app["sources"]].compact
            app["sources"] = sources + ["StormbreakerIcon"]
            File.write("project.yml", spec.to_yaml)
          end
          File.write("#{dir}/Contents.json", JSON.generate({images: [{filename: "AppIcon.png", idiom: "universal",
                                                                    platform: "ios", size: "1024x1024"}],
                                                           info: {author: "xcode", version: 1}}))
          File.write(ENV["GITHUB_ENV"], "ICON_NAME=#{File.basename(dir, ".appiconset")}\nICON_TITLE=#{title.gsub(/\s+/, " ")}\n" \
                                        "ICON_PATH=#{File.expand_path(dir)}/AppIcon.png\n", mode: "a")
          puts "No icon found: making a simple one in #{dir} (add your own to replace it)."
          RUBY
      - name: Draw the icon
        if: env.ICON_PATH != ''
        run: |
          cat > "$RUNNER_TEMP/icon.swift" <<'SWIFT'
          import CoreGraphics
          import CoreText
          import Foundation
          import ImageIO
          import UniformTypeIdentifiers
          // 1024 x 1024, no transparency (App Store Connect refuses icons with an alpha channel).
          let title = CommandLine.arguments[1], out = CommandLine.arguments[2], n = 1024
          let space = CGColorSpaceCreateDeviceRGB()
          let ctx = CGContext(data: nil, width: n, height: n, bitsPerComponent: 8, bytesPerRow: 0, space: space,
                              bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue)!
          let colors = [CGColor(red: 0.26, green: 0.22, blue: 0.79, alpha: 1), CGColor(red: 0.55, green: 0.33, blue: 0.93, alpha: 1)] as CFArray
          ctx.drawLinearGradient(CGGradient(colorsSpace: space, colors: colors, locations: [0, 1])!,
                                 start: CGPoint(x: 0, y: n), end: CGPoint(x: n, y: 0), options: [])
          let letter = String(title.trimmingCharacters(in: .whitespacesAndNewlines).prefix(1)).uppercased()
          let font = CTFontCreateUIFontForLanguage(.emphasizedSystem, 600, nil)!
          let text = NSAttributedString(string: letter.isEmpty ? "A" : letter, attributes: [
            NSAttributedString.Key(kCTFontAttributeName as String): font,
            NSAttributedString.Key(kCTForegroundColorAttributeName as String): CGColor(red: 1, green: 1, blue: 1, alpha: 1)])
          let line = CTLineCreateWithAttributedString(text)
          let box = CTLineGetBoundsWithOptions(line, .useGlyphPathBounds)
          ctx.textPosition = CGPoint(x: (CGFloat(n) - box.width) / 2 - box.minX, y: (CGFloat(n) - box.height) / 2 - box.minY)
          CTLineDraw(line, ctx)
          let dest = CGImageDestinationCreateWithURL(URL(fileURLWithPath: out) as CFURL, UTType.png.identifier as CFString, 1, nil)!
          CGImageDestinationAddImage(dest, ctx.makeImage()!, nil)
          guard CGImageDestinationFinalize(dest) else { fatalError("could not write \(out)") }
          SWIFT
          swift "$RUNNER_TEMP/icon.swift" "$ICON_TITLE" "$ICON_PATH"
          sips -g pixelWidth -g hasAlpha "$ICON_PATH"
      - name: Generate the Xcode project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Archive (signed by Apple with the API key)
        run: |
          extra=()
          [ -n "${ICON_NAME:-}" ] && extra+=("ASSETCATALOG_COMPILER_APPICON_NAME=$ICON_NAME")
          # Standard HTTPS only, which is exempt; without this every build waits on a compliance question in App Store Connect.
          grep -rqs ITSAppUsesNonExemptEncryption --include=project.yml --include='*.plist' . || extra+=("INFOPLIST_KEY_ITSAppUsesNonExemptEncryption=NO")
          xcodebuild archive -project iOSApp.xcodeproj -scheme iOSApp -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iOSApp.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" "${extra[@]}" 2>&1 | tee xcodebuild.log
      - name: Upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/iOSApp.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee -a xcodebuild.log
          echo "Uploaded build ${{ github.run_number }}.${{ github.run_attempt }}. Apple processes it (usually 10-30 minutes) before it shows in TestFlight."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
