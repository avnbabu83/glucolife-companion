name: api

on:
  push:
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diabeteasy
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: diabeteasy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U diabeteasy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: pytest (${{ matrix.database }})
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://diabeteasy:ci-only-password@localhost:5432/diabeteasy_test' || '' }}
        run: python -m pytest -q --cov=app --cov-fail-under=80
      - name: migrations apply cleanly on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://diabeteasy:ci-only-password@localhost:5432/diabeteasy_test
        run: |
          python -c "from sqlalchemy import create_engine, text; e=create_engine('$DATABASE_URL'); c=e.connect(); c.execute(text('DROP SCHEMA public CASCADE; CREATE SCHEMA public')); c.commit()"
          alembic upgrade head && alembic check && alembic downgrade base

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t diabeteasy-api:ci api
