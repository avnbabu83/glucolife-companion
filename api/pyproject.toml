[project]
name = "diabeteasy-api"
version = "1.0.0"
description = "DiabetEasy phase 1 backend (FastAPI + PostgreSQL)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends() defaults. UP017/UP035: keep timezone.utc and typing.Callable.
# UP036: the Python version guard in app/__init__.py is intentional.
ignore = ["B008", "UP007", "UP045", "B904", "UP017", "UP035", "UP036"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]
